[workspace]
members = ["herd-sim", "herd-edge"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.86"
license = "Apache-2.0"
repository = "https://github.com/umwelt-sim/herd"
publish = false

[workspace.dependencies]
umwelt = { path = "../umwelt-rs" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
